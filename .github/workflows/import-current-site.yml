name: Import current Snjokallinn source
on:
  push:
    branches: [migration/current-site-import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import the exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat .migration/parent)"
          expected_tree="$(cat .migration/tree)"
          expected_sha256="$(cat .migration/sha256)"
          source_commit="$(cat .migration/source-commit)"
          archive="$RUNNER_TEMP/snjokallinn-source.tar.gz"
          cat .migration/part-* > "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          git config user.name "Snjokallinn source import"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch .
          tar -xzf "$archive" -C .
          git add --all
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          commit="$(printf 'Import current Snjokallinn website source\n\nOriginal source commit: %s\nVerified source tree: %s\n' "$source_commit" "$actual_tree" | git commit-tree "$actual_tree" -p "$base")"
          git push origin "$commit:refs/heads/main"
          echo "Imported commit: $commit"
          echo "Verified tree: $actual_tree"
          git push origin --delete migration/current-site-import
