<!doctype html><html lang="is"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7ef"><title>Myndavélahjálp · Smelltu! · Sjút</title><meta name="description" content="Einfaldar og sjónrænar leiðbeiningar fyrir Bleiku vélina (Canon 250D) og Þjarkinn (Canon R8)."><link rel="icon" href="/sjut/favicon.svg"><style>
:root{--ink:#302a43;--pink:#f3a6cb;--paper:#fff7ef;--purple:#b8abe5;--green:#bfdcc5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}button,a{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #6545b6;outline-offset:5px}header,main,footer{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e7dbd4}.brand{font:900 23px monospace;letter-spacing:-1px}.small{font-size:13px;color:#645b73}.hero{text-align:center;padding:30px 0 20px}.eyebrow{font:700 13px monospace;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(35px,7vw,65px);line-height:1.05;letter-spacing:-2px;margin:14px 0}h2{font-size:28px;line-height:1.2}h3{margin:0 0 8px;font-size:23px}p{margin:12px 0}.hero p{color:#665d76}.choices{display:grid;grid-template-columns:1fr 1fr;gap:24px}.camera-card{border:2px solid var(--ink);border-radius:24px;background:#f9d6e7;padding:24px;box-shadow:5px 5px 0 var(--ink);text-align:center;transition:transform .15s}.camera-card:hover{transform:translateY(-4px)}.camera-card:nth-child(2){background:#e2dcf5}.camera-card svg{width:100%;max-width:260px;height:180px}.camera-card h2{margin:10px 0 2px}.tag{display:inline-block;font:700 12px monospace;letter-spacing:1px;background:#fff9;padding:5px 10px;border-radius:6px}.go{display:block;margin:18px auto 0;font-weight:700}.muted{color:#665d76}.back,.pill,.navbtn{border:1.5px solid var(--ink);background:white;border-radius:12px;padding:10px 16px;min-height:46px}.back{font-size:14px}.intro{display:flex;align-items:center;gap:20px;margin:24px 0}.intro svg{width:130px;height:100px;flex-shrink:0}.intro h1{font-size:38px;letter-spacing:-1px}.dialarea{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}.dial{position:relative;width:232px;height:232px;border-radius:50%;background:#393246;border:8px solid #b7adbd;box-shadow:4px 4px 0 #302a43;margin:auto}.dial button{position:absolute;left:calc(50% - 24px);top:calc(50% - 24px);width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:white;font:700 13px monospace}.dial button[aria-pressed=true]{background:#f3a6cb;color:#302a43;box-shadow:0 0 0 3px white}.dialcenter{position:absolute;inset:88px 0;text-align:center;color:#c5b7d1;font:12px monospace;pointer-events:none}.modegrid{display:flex;flex-wrap:wrap;gap:8px}.pill[aria-pressed=true]{background:#f3a6cb}.guide{margin-top:28px;background:white;border:2px solid var(--ink);border-radius:20px;padding:24px;box-shadow:4px 4px 0 #d8cce0}.guidehead{display:flex;align-items:center;gap:14px}.modebadge{font:900 26px monospace;min-width:65px;padding:12px;background:#e3dcf4;border-radius:10px;text-align:center}.steps{margin:20px 0 0;padding:0;list-style:none;counter-reset:steps}.steps li{counter-increment:steps;padding:12px 0;display:flex;gap:14px;border-top:1px solid #ede7f1}.steps li:before{content:counter(steps);background:#e3dcf4;min-width:30px;height:30px;line-height:30px;text-align:center;font-weight:bold;border-radius:8px}.note{padding:14px 18px;background:#fff2d3;border-radius:12px;margin:18px 0 0;font-size:15px}.recipe{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;margin:22px 0;border:2px solid var(--ink);border-radius:14px;padding:18px;background:#f9d6e7;font-weight:bold;box-shadow:3px 3px 0 #302a43}.recipe small{display:block;font-weight:400}.lcd{background:#302a43;color:#fcf6ff;padding:24px 15px;border:8px solid #ada3b7;border-radius:12px;margin:20px auto;text-align:center;max-width:440px}.lcd .values{display:flex;justify-content:space-around;gap:6px;font:700 clamp(20px,5vw,32px) monospace}.lcd small{font-size:12px;display:block;color:#d7cde0}.progress{height:8px;background:#e8dfec;border-radius:10px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#ad78bf}.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.navbtn.primary{background:#bfdcc5}.navbtn:disabled{opacity:.4;cursor:default}.visual{min-height:145px;display:flex;align-items:center;justify-content:center;background:#faf4fb;border-radius:12px;margin:16px 0;gap:12px}.big{font:900 58px monospace}.visual svg{width:190px;height:145px}.basics{margin:35px 0}.basics details{border-bottom:1px solid #dcd2e1;padding:14px 0}.basics summary{font-weight:700;cursor:pointer;min-height:40px}.basics p{font-size:16px}.sim{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sim button{border:1px solid #90839a;border-radius:8px;background:white;padding:9px;min-height:44px}.sim button.active{background:#e3dcf4}.simscene{height:135px;background:#f2c9db;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;gap:18px}.subject{font-size:52px}.tree{font-size:52px;transition:filter .2s}.result{min-height:50px}.helper{background:#e9eee2;border-radius:16px;padding:20px;margin-top:30px}.footer{font-size:12px;border-top:1px solid #e7dbd4}a{color:#6545a3} [hidden]{display:none!important}@media(max-width:600px){header,main,footer{padding:18px}.choices{gap:15px}.camera-card{padding:12px;border-radius:18px}.camera-card h2{font-size:21px}.camera-card svg{height:125px}.camera-card p{font-size:13px}.camera-card .go{font-size:14px}.dialarea{grid-template-columns:1fr}.dial{margin-top:6px}.intro{gap:10px}.intro svg{width:90px}.intro h1{font-size:29px}.guide{padding:18px}.hero{padding-top:20px}.small.top{max-width:125px;text-align:right}.recipe{font-size:16px}.tag{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><header><div><a href="/" style="display:block;color:inherit;font-size:14px;margin-bottom:8px">← Aftur á Sjút</a><span class="brand">✦ SMELLTU!</span></div><span class="small top">Myndavélarnar hans Alex<br>Engin reynsla nauðsynleg.</span></header><main id="app"></main><footer class="footer"><b>Lítill myndavélaskóli · Snjókallinn</b><p>Teikningarnar eru einfaldar skýringarmyndir, ekki nákvæmar myndir af hnöppunum. Heiti á skjá geta verið á ensku.</p><a href="https://gdlp01.c-wss.com/gds/4/0300034864/02/EOS_250D_Advanced_User_Guide_EN.pdf" target="_blank" rel="noopener">Canon 250D handbók ↗</a> · <a href="https://cam.start.canon/en/C013/manual/html/index.html" target="_blank" rel="noopener">Canon R8 handbók ↗</a></footer><script>
const app=document.querySelector('#app');let camera=null,mode='A+',step=0;
function cam(pink=false,flash=false){let b=pink?'#efa0c3':'#625b73',l=pink?'#ffc9df':'#93879e';return `<svg viewBox="0 0 160 110" role="img" aria-label="${pink?'Bleik Canon 250D':'Canon R8'} í 8 bita stíl" shape-rendering="crispEdges"><path d="M18 92h124v5H18z" fill="#302a43" opacity=".12"/><path d="M12 39h14V29h30V18h41v11h33v10h16v51H12z" fill="#302a43"/><path d="M18 43h15V35h28V24h30v11h34v8h15v41H18z" fill="${b}"/><path d="M20 45h16v36H20zM62 26h27v9H62z" fill="${l}"/><path d="M106 36h17v6h-17z" fill="#d7c6dd"/><path d="M55 43h43v7h8v28h-8v8H55v-8h-8V50h8z" fill="#302a43"/><path d="M61 48h31v7h8v17h-8v8H61v-8h-8V55h8z" fill="#a5adcf"/><path d="M67 54h19v5h7v12h-7v5H67v-5h-7V59h7z" fill="#534c76"/><path d="M66 55h10v9H66z" fill="#d9e5f7"/><path d="M29 58h5v5h-5zM115 58h5v5h-5z" fill="#302a43"/><path d="M27 65h9v4h-9zM113 65h9v4h-9z" fill="#ec87a7"/>${flash?'<path d="M64 18V7h26v11" fill="#302a43"/><path d="M68 8h18v7H68z" fill="#fff7cd"/><path d="M99 2h5v7h7v5h-7v7h-5v-7h-7V9h7z" fill="#e5b94e"/>':''}</svg>`}
const data={
'A+':['Sjálfvirkt','Vélin sér um lýsinguna. Best ef þú vilt bara byrja.',['Snúðu skífunni á græna A+.','Taktu lokið af linsunni. Veldu AF á linsunni ef þar er AF/MF rofi.','Beindu að manneskjunni. Ýttu myndatökuhnappinum hálfa leið niður til að fókusa.','Haltu vélinni kyrrri og ýttu hnappinum alla leið niður.'],'Ef fókus næst ekki: prófaðu að standa aðeins lengra frá og finna meiri birtu.'],
P:['P · Smá hjálp','Vélin velur hraða og ljósop. Þú getur valið ISO og fleira.',['Snúðu skífunni á P.','Ýttu á Q og veldu ISO. Auto er einfaldur upphafspunktur.','Fókusaðu með hálfri niðurýtingu og taktu mynd.','Skoðaðu myndina. Lýsingarbætur (+/−) hjálpa ef hún er of ljós eða dökk.'],'P er þægileg brú frá sjálfvirku yfir í meiri stjórn.'],
Tv:['Tv · Stjórna hreyfingu','Þú velur lokarahraða. Vélin velur ljósopið.',['Snúðu skífunni á Tv.','Snúðu aðalskífunni við myndatökuhnappinn til að breyta hraðanum.','Prófaðu 1/250 fyrir rólegt fólk eða 1/1000 fyrir hraða hreyfingu. Þetta eru upphafspunktar.','Veldu ISO Auto með Q. Fókusaðu og taktu prufumynd.'],'Blikkandi ljósopstala getur þýtt að vélin nái ekki réttri lýsingu. Prófaðu meiri birtu eða annan hraða.'],
Av:['Av · Stjórna bakgrunni','Þú velur ljósop. Vélin velur lokarahraðann.',['Snúðu skífunni á Av.','Snúðu aðalskífunni til að velja f-tölu.','Lág f-tala getur gefið óskýran bakgrunn. Hærri f-tala hjálpar að hafa meira í fókus.','Veldu ISO Auto. Athugaðu að hraðinn verði ekki of hægur fyrir fólkið sem þú myndar.'],'Minnsta f-talan fer eftir linsunni og getur breyst þegar þú zoomar.'],
M:['M · Þú stjórnar','Þú velur hraða, ljósop og ISO.',['Snúðu skífunni á M.','Veldu hraða. Byrjaðu til dæmis á 1/250 fyrir fólk í góðri birtu.','Veldu ljósop og ISO með Q-skjánum. Stilltu gildin og staðfestu valið.','Taktu prufumynd og skoðaðu hana. Stilltu eitt gildi í einu.'],'ISO Auto getur enn breytt lýsingunni í M. Veldu ákveðna ISO-tölu þegar þú vilt fulla stjórn.'],
SCN:['SCN · Veldu aðstæðurnar','Tilbúnar stillingar fyrir ákveðin myndefni.',['Snúðu skífunni á SCN.','Ýttu á Q og veldu senuna sem passar við aðstæður.','Veldu til dæmis Portrait fyrir manneskju eða Sports fyrir hreyfingu.','Fókusaðu og taktu mynd. Vélin stillir margt sjálf.'],'SCN er einn staður á skífunni. Undirstillingarnar eru valdar á skjánum.'],
filters:['Skapandi síur','Leiktu þér með útlit myndarinnar.',['Snúðu skífunni á táknið fyrir Creative filters (skapandi síur).','Veldu síu á skjánum, til dæmis Grainy B/W eða Toy camera.','Breyttu styrk áhrifa ef sá valmöguleiki birtist.','Taktu prufumynd og skoðaðu útkomuna.'],'Síur geta takmarkað skráarsnið og aðrar stillingar. Notaðu A+, P eða M ef þú vilt venjulega mynd.'],
Fv:['Fv · Blandað sjálfvirkt','Veldu hvað þú stjórnar og hvað vélin stjórnar.',['Snúðu skífunni á Fv.','Notaðu aftari skífuna til að velja hraða, ljósop, ISO eða lýsingarbætur.','Snúðu aðalskífunni til að breyta valda gildinu.','Gildi sem standa á AUTO eru valin af vélinni. Fókusaðu og taktu mynd.'],'Fv er sveigjanlegt. A+ eða Av er einfaldara ef þú ert að byrja.'],
B:['B · Langar lýsingar','Lokarinn helst opinn meðan þú heldur hnappinum niðri.',['Snúðu skífunni á B.','Settu vélina á þrífót og veldu ljósop og ISO.','Haltu myndatökuhnappinum niðri til að byrja lýsinguna.','Slepptu til að enda hana. Prófaðu fjarstýringu eða Bulb timer fyrir minni hristing.'],'Fyrir næturmyndir og ljósaslóðir. Þú þarft yfirleitt stöðuga undirstöðu.'],
C1:['C1 · Vistuð uppskrift','Kallar fram áður vistaðar stillingar.',['Snúðu skífunni á C1.','Vélin kallar fram stillingar sem voru vistaðar þar.','Taktu prufumynd og skoðaðu hraða, ljósop og ISO á skjánum.'],'Ekki er vitað hvað Alex hefur vistað hér. Spurðu hann áður en þú treystir þessari stillingu.'],
C2:['C2 · Önnur uppskrift','Annar staður fyrir áður vistaðar stillingar.',['Snúðu skífunni á C2.','Skoðaðu gildin á skjánum áður en þú tekur mynd.','Fókusaðu og taktu prufumynd.'],'Ekki er vitað hvað Alex hefur vistað á C2. Ekki skrá yfir stillingarnar hans.']};
function home(){camera=null;app.innerHTML=`<section class="hero"><span class="eyebrow">Litli myndavélaskólinn</span><h1>Þú getur þetta.</h1><p>Veldu vélina sem þú ert með.<br>Við tökum þetta eitt skref í einu.</p></section><section class="choices"><button class="camera-card" data-camera="pink"><span class="tag">CANON EOS 250D</span>${cam(true)}<h2>Bleika vélin</h2><p>Litla bleika vinkonan.<br>Með innbyggðu flassi.<br>18-135 mm linsa.</p><span class="go">Velja Bleiku vélina →</span></button><button class="camera-card" data-camera="r8"><span class="tag">CANON EOS R8</span>${cam()}<h2>Þjarkurinn</h2><p>Stóri litli töffarinn.<br>Án innbyggðs flass.</p><span class="go">Velja Þjarkinn →</span></button></section><div class="helper"><b>Fyrsta myndin? Byrjaðu á A+.</b><p>Taktu linsulokið af → kveiktu → veldu A+ → ýttu hálfa leið til að fókusa → alla leið til að taka mynd.</p></div>`}
function dial(modes){return `<div class="dial" aria-label="Einfölduð stillingaskífa">${modes.map((m,i)=>{let a=(i/modes.length)*Math.PI*2;return `<button data-mode="${m}" aria-label="${m==='filters'?'Skapandi síur':m}" aria-pressed="${mode===m}" style="transform:translate(${Math.sin(a)*82}px,${-Math.cos(a)*82}px)">${m==='filters'?'✦':m}</button>`}).join('')}<span class="dialcenter">VELDU<br>STILLINGU</span></div>`}
function page(){let pink=camera==='pink',modes=pink?['A+','SCN','filters','M','Av','Tv','P']:['A+','SCN','filters','Fv','P','Tv','Av','M','B','C1','C2'];app.innerHTML=`<button class="back" data-home>← Velja aðra vél</button><div class="intro">${cam(pink)}<div><span class="eyebrow">Canon ${pink?'EOS 250D':'EOS R8'}</span><h1>${pink?'Bleika vélin':'Þjarkurinn'}</h1>${pink?'<p class="small">18-135 mm · f/3.5-5.6</p>':''}</div></div>${pink?'<button class="recipe" data-recipe><span>✦ Flassuppskriftin hans Alex<small>18 mm · Flass upp · 1/15 · f/3.5 · ISO 200</small></span><span>→</span></button>':'<p class="note">Þjarkurinn er ekki með innbyggðu flassi. Til að nota flass þarf ytra flass.</p>'}<button class="recipe" data-cool><span>⚡ Ég vil eitthvað KÚL!<small>1/15 · ISO 200 · f/8 eða f/11 · Godox V1</small></span><span>→</span></button><section class="dialarea">${dial(modes)}<div><h2>Hvað stendur á skífunni?</h2><p class="muted">Finndu stafina ofan á vélinni og veldu þá hér.</p><div class="modegrid">${modes.map(m=>`<button class="pill" data-mode="${m}" aria-pressed="${mode===m}">${m==='filters'?'✦ Síur':m}</button>`).join('')}</div><p class="small">Skífan hér er skýringarmynd. ✦ táknar skapandi síur.</p></div></section><section id="guide" class="guide" aria-live="polite"></section>${pink?'':adapters()}${lenses(pink)}${basics(pink)}`;showMode()}
function showMode(){let d=data[mode];let screens={'A+':['AUTO','AUTO','AUTO'],P:['AUTO','AUTO','AUTO'],Tv:['1/250','AUTO','AUTO'],Av:['AUTO','f/3.5','AUTO'],M:['1/250','f/4','200'],Fv:['AUTO','AUTO','AUTO'],B:['BULB','f/8','100']};let vals=screens[mode];document.querySelector('#guide').innerHTML=`<div class="guidehead"><span class="modebadge">${mode==='filters'?'✦':mode}</span><div><h3>${d[0]}</h3><span class="muted">${d[1]}</span></div></div><div class="visual"><span class="modebadge">${mode==='filters'?'✦':mode}</span><span>→</span>${cam(camera==='pink')}</div>${vals?`<div class="lcd"><div class="values">${vals.map((v,i)=>`<span>${v}<small>${['HRAÐI','LJÓSOP','ISO'][i]}</small></span>`).join('')}</div><small>Dæmi til skýringar, ekki tilbúin uppskrift fyrir allar aðstæður.</small></div>`:''}<ol class="steps">${d[2].map(x=>`<li><span>${x}</span></li>`).join('')}</ol><p class="note">${d[3]}</p>`}
const recipeSteps=[['Zoomaðu út í 18 mm','Snúðu zoomhringnum á 18-135 mm linsunni þar til merkið bendir á 18. Þá sérðu meira af umhverfinu og getur valið f/3.5. Zoomhringurinn breytir útsniðinu; hann er ekki fókushringurinn.','18 mm'],['Veldu M','Snúðu stillingaskífunni ofan á Bleiku vélinni á M.','M'],['Poppaðu flassinu upp','Lyftu innbyggða flassinu varlega upp með fingrunum. Ekki reyna að finna flass í Þjarkinum.','flash'],['Stilltu hraðann á 1/15','Snúðu aðalskífunni við myndatökuhnappinn þar til hraðinn er 1/15 sekúnda. Skjárinn getur sýnt 15 fyrir 1/15. Ekki velja 15″: það eru 15 heilar sekúndur!','1/15'],['Stilltu ljósopið á f/3.5','Haltu Av/± hnappinum niðri og snúðu aðalskífunni þar til f/3.5 birtist. Eða veldu ljósop á Q-skjánum.','f/3.5'],['Stilltu ISO á 200','Ýttu á ISO-hnappinn og veldu 200. Eða ýttu á Q, veldu ISO og stilltu 200. Ekki skilja ISO eftir á Auto.','ISO 200'],['Fókusaðu og smelltu','Haltu vélinni með báðum höndum. Ýttu myndatökuhnappinum hálfa leið niður til að fókusa og svo alla leið niður. Bíddu eftir að flassið sé tilbúið milli mynda.','shoot']];
function recipe(){let r=recipeSteps[step];document.querySelector('#guide').innerHTML=`<span class="tag">FLASSUPPSKRIFT · SKREF ${step+1} AF ${recipeSteps.length}</span><div class="progress"><span style="width:${(step+1)/recipeSteps.length*100}%"></span></div><h2>${r[0]}</h2><div class="visual">${r[2]==='flash'?cam(true,true):r[2]==='shoot'?cam(true,true):`<span class="big" style="font-size:${r[2].length>5?'36':'58'}px">${r[2]}</span>`}</div><p>${r[1]}</p>${step===4?'<p class="note">Kemst ljósopið ekki niður í f/3.5? Athugaðu að zoomhringurinn sé á 18 mm. Þessi 18-135 mm linsa er með breytilegt hámarksljósop, f/3.5-5.6: þegar þú zoomar inn geturðu ekki alltaf valið f/3.5.</p>':''}${step===recipeSteps.length-1?'<div class="lcd"><div class="values"><span>1/15<small>HRAÐI</small></span><span>f/3.5<small>LJÓSOP</small></span><span>200<small>ISO</small></span></div></div><p class="note">1/15 er hægur hraði. Flassið getur fryst hluta myndefnisins, en hreyfing og ljós í umhverfinu geta líka myndað slóðir. Þetta er skapandi uppskrift, ekki trygging fyrir skörpum myndum í öllum aðstæðum.</p>':''}<div class="navrow"><button class="navbtn" data-prev ${step===0?'disabled':''}>← Til baka</button><button class="navbtn primary" ${step===recipeSteps.length-1?'data-done':'data-next'}>${step===recipeSteps.length-1?'Tilbúið ✓':'Næsta skref →'}</button></div><button class="back" style="margin-top:18px" data-close>Til baka í stillingar</button>`;document.querySelector('#guide').scrollIntoView({block:'start',behavior:'instant'})}
function lenses(pink=false){return `<section class="basics"><span class="eyebrow">Linsurnar hans Alex</span><h2>Hvaða linsu á ég að velja?</h2><p>35 mm sýnir meira af umhverfinu. 50 mm er mitt á milli. 85 mm gefur þrengra útsnið frá sama stað. ${pink?'Á Bleiku vélinni verður útsniðið þrengra en á Þjarkinum með sömu linsu. 18-135 mm kitlinsan gefur þér líka möguleika á að zooma.':'Tölurnar hér miðast við Þjarkinn.'}</p><details><summary>Rokinon 35 mm f/1.4 · EF · allt handvirkt</summary><p><b>Góð fyrir:</b> Fólk með umhverfi, stemningu og skapandi myndir þar sem þú hefur tíma til að fókusa.</p><ol class="steps"><li><span>Stilltu ljósopið á hringnum á linsunni. f/1.4 er stærsta ljósopið; hærri f-tala gefur meira svigrúm í fókus.</span></li><li><span>Snúðu fókushringnum þar til myndefnið er skarpt. Hálf niðurýting á myndatökuhnappinum fókusar ekki þessari linsu.</span></li><li><span>Stækkaðu myndina á skjánum til að athuga fókus, sérstaklega augun. Focus peaking getur hjálpað ef það er virkt.</span></li><li><span>Taktu prufumynd. Athugaðu fókus aftur ef þú eða manneskjan færist.</span></li></ol><p class="note">Vélin getur ekki breytt ljósopi á þessari handvirku linsu. Skjárinn getur sýnt F00 ef engin rafræn samskipti eru við linsuna. Ef hún tekur ekki mynd vegna þess að linsa greinist ekki getur þurft að virkja „Release shutter w/o lens“; spurðu Alex áður en þú breytir valmyndinni.</p></details><details><summary>Canon 85 mm f/1.4 · EF · fyrir portrett</summary><p><b>Góð fyrir:</b> Andlitsmyndir og portrett með mjúkum bakgrunni.</p><ol class="steps"><li><span>Veldu AF á linsunni ef þú vilt sjálfvirkan fókus.</span></li><li><span>Veldu Av á vélinni og ljósop, til dæmis f/2.8 sem upphafspunkt. f/1.4 getur gert bakgrunninn mjög mjúkan en krefst nákvæms fókus.</span></li><li><span>Stattu nægilega langt frá til að manneskjan komist í rammann. Ekki búast við að geta zoomað: þetta er föst 85 mm linsa.</span></li><li><span>Fókusaðu á augun og taktu prufumynd. Athugaðu líka lokarahraðann.</span></li></ol></details><details><summary>Canon 50 mm f/1.8 · EF · einföld alhliða linsa</summary><p><b>Góð fyrir:</b> Fólk, hversdagsmyndir og portrett með aðeins meira umhverfi en 85 mm.</p><ol class="steps"><li><span>Veldu AF ef AF/MF rofi er á linsunni; annars athugaðu fókusstillinguna í vélinni.</span></li><li><span>Veldu Av. Prófaðu f/2.8; opnaðu í f/1.8 ef þú vilt meira ljós eða mýkri bakgrunn.</span></li><li><span>Færðu þig nær eða fjær til að breyta útsniðinu. Linsan zoomar ekki.</span></li><li><span>Fókusaðu á augun og taktu mynd.</span></li></ol></details><details><summary>Dispolense · RF · einnota-filmuvélarfílingur</summary><p><b>Góð fyrir:</b> Leikandi, hráan filmufíling í mikilli birtu eða með Godox V1 ofan á vélinni.</p><div class="lcd"><div class="values"><span>f/11<small>FAST LJÓSOP</small></span><span>FASTUR<small>FÓKUS</small></span></div></div><ol class="steps"><li><span>Þessi linsa er með RF-festingu og fer beint á R8. Ekki nota EF → RF millistykki með henni.</span></li><li><span>Ljósopið er alltaf f/11. Þú getur ekki opnað það meira með skífunni á vélinni.</span></li><li><span>Fókusinn er fastur. Vélin getur ekki sjálfvirkt fókusað linsunni og þú snýrð ekki fókushring. Prófaðu mismunandi fjarlægðir og skoðaðu útkomuna; mjög nálægt myndefni getur orðið óskýrt.</span></li><li><span>Byrjaðu í góðri dagsbirtu. Ef þú notar Godox V1 skaltu staðfesta rétta uppsetningu og stillingar með Alex og taka prufumynd.</span></li></ol><p class="note">Of dökk mynd? Leitaðu að meiri birtu, hækkaðu ISO eða notaðu flass. Hægari lokarahraði getur líka hjálpað en eykur hættu á hreyfiþoku. ND-sía dregur enn meira úr ljósinu.</p><p class="small">Linsan getur sýnt F00 á skjánum vegna þess að hún sendir ekki ljósopsgildið til vélarinnar. Raunverulega ljósopið er samt f/11. Nákvæm fókusfjarlægð og útgáfa Godox V1 eru ekki skráð hér.</p></details><p class="note"><b>Festingin skiptir máli:</b> Rokinon 35 mm, Canon 85 mm og Canon 50 mm eru allar með EF-festingu. Þær þurfa annað af EF → RF millistykkjunum á Þjarkinn (R8), en passa beint á Bleiku vélina (250D). Dispolensan er RF: hún fer beint á Þjarkinn, án millistykkis, og passar ekki á Bleiku vélina.</p></section>`}
function adapters(){return `<section class="basics"><span class="eyebrow">Linsur á Þjarkinn</span><h2>Tvö millistykki · EF → RF</h2><p>Millistykkið fer á milli EF-linsunnar og R8. RF-linsa fer beint á vélina og þarf ekki þessi millistykki.</p><details open><summary>Venjulega millistykkið · byrjaðu hér</summary><p>Tengir EF-linsuna við Þjarkinn án ND-síu. Þægilegt inni, í lítilli birtu og þegar þú þarft ekki að minnka ljósið.</p><div class="lcd"><div class="values" style="font-size:clamp(10px,2.6vw,20px);flex-wrap:wrap"><span>EF-linsa</span><span>→</span><span>Millistykki</span><span>→</span><span>R8</span></div></div><ol class="steps"><li><span>Slökktu á vélinni áður en þú skiptir um linsu eða millistykki.</span></li><li><span>Stilltu festimerki millistykkisins og vélarinnar saman. Snúðu varlega þar til það smellur.</span></li><li><span>Stilltu rauða merkið á EF-linsunni við rauða merkið á millistykkinu og snúðu þar til hún smellur. Ekki beita afli.</span></li><li><span>Kveiktu, veldu AF og taktu prufumynd.</span></li></ol></details><details><summary>ND-millistykkið · sólgleraugu fyrir vélina</summary><p>ND-sían minnkar ljósið sem fer inn í vélina. Litla snúningshjólið breytir styrk hennar. Hún getur hjálpað þér að nota stórt ljósop eða hægan lokarahraða í mikilli birtu.</p><ol class="steps"><li><span>Settu ND-millistykkið á milli EF-linsunnar og R8 þegar vélin er slökkt.</span></li><li><span>Kveiktu og byrjaðu með sem minnstan ND-styrk samkvæmt merkingunum á millistykkinu.</span></li><li><span>Snúðu litla ND-hjólinu hægt og horfðu á myndina á skjánum. Meiri ND þýðir minna ljós. Ekki þvinga hjólið fram yfir endamörk.</span></li><li><span>Taktu prufumynd. Ef myndin verður of dökk skaltu minnka ND-styrkinn. Í lítilli birtu geturðu notað venjulega millistykkið.</span></li></ol><p class="note">Sjálfvirkar stillingar geta bætt upp fyrir ND með hærra ISO eða hægari lokara, svo skjárinn verður ekki alltaf dekkri. Fylgstu líka með tölunum. Minnsti ND-styrkur er ekki endilega það sama og engin sía.</p><p>Prófaðu áhrifin hér, þetta er aðeins skýring, ekki nákvæmur styrkur síunnar hans Alex.</p><label for="nddemo"><b>Minni ND ← → Meiri ND</b></label><input id="nddemo" type="range" min="0" max="100" value="0" style="width:100%;min-height:44px"><div class="simscene" style="position:relative"><span class="subject">🧍</span><span>☀️ 🌳</span><span id="ndshade" aria-hidden="true" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none"></span></div><p id="ndresult" aria-live="polite">Minni ND: meira ljós kemst inn.</p><p class="small">Nákvæm gerð og styrkleikasvið millistykkisins eru ekki skráð hér. Ekki fjarlægja síuna til að slökkva á ND; notaðu venjulega millistykkið ef þú vilt sleppa henni.</p></details></section>`}
app.addEventListener('input',e=>{if(e.target.id==='nddemo'){const v=Number(e.target.value);document.querySelector('#ndshade').style.opacity=v/100*.85;document.querySelector('#ndresult').textContent=v<34?'Minni ND: meira ljós kemst inn.':v<67?'Miðlungs ND: minna ljós kemst inn.':'Meiri ND: mun minna ljós kemst inn. Athugaðu lýsinguna.'}});

let coolStep=0;
function cool(){const pink=camera==='pink';const steps=[['Veldu ljós og stemningu','Finndu stað með sýnilegum ljósum í bakgrunni, til dæmis lituðum lömpum. Byrjaðu í rökkri eða dimmu innirými. Birtan í umhverfinu ræður hversu miklar ljósaslóðir sjást.','✦'],['Settu Godox V1 á vélina','Slökktu á vél og flassi áður en þú festir flassið í flassskóinn. Læstu festingunni og kveiktu aftur. Notaðu V1 sem er samhæft Canon. Þetta er uppskrift fyrir ytra flassið, ekki innbyggða flassið á Bleiku vélinni.','V1'],['Stilltu vélina á M og 1/15','Veldu M á skífunni. Stilltu hraðann á 1/15 sekúndu með aðalskífunni. Á skjánum getur 15 þýtt 1/15. Ekki velja 15″, það eru 15 heilar sekúndur!','1/15'],['Veldu ISO 200 og f/8 eða f/11','Veldu ISO 200, ekki Auto. Byrjaðu á f/8 á venjulegri linsu; prófaðu f/11 fyrir minna umhverfisljós. Dispolensan er alltaf f/11 og passar aðeins á R8. Rokinon þarf að stilla á ljósopshring linsunnar.','f/8-11'],['Stilltu flassið á M og 1/8','Á Godox V1 velurðu M (handvirkan ham), ekki TTL. Byrjaðu á 1/8 styrk. Ef viðfangsefnið er of dökkt skaltu prófa 1/4, sem er tvöfalt meiri flassorka. Fjarlægðin frá fólkinu og aukahlutir á flassinu hafa líka áhrif.','1/8'],['Fókusaðu, smelltu og hreyfðu vélina','Fókusaðu fyrst á manneskjuna. Biddu hana að vera kyrr. Ýttu hnappinum alveg niður og hreyfðu vélina örlítið til hliðar eða í lítinn boga á meðan myndin er tekin. Prófaðu líka eina mynd með alveg kyrrri vél til samanburðar.','↔'],['Skoðaðu prufumyndina','Flassblossinn getur fryst manneskjuna en umhverfisljósið teiknar hreyfislóðir á meðan lokarinn er opinn. Ef umhverfið lýsir manneskjuna mikið getur hún líka fengið draugaslóð. Prófaðu og breyttu einu atriði í einu.','KÚL!']];const r=steps[coolStep];document.querySelector('#guide').innerHTML=`<span class="tag">ÉG VIL EITTHVAÐ KÚL! · ${coolStep+1} / ${steps.length}</span><div class="progress"><span style="width:${(coolStep+1)/steps.length*100}%"></span></div><h2>${r[0]}</h2><div class="visual"><span class="big" style="font-size:40px">${r[2]}</span></div><p>${r[1]}</p>${coolStep===6?`<div class="lcd"><div class="values"><span>1/15<small>HRAÐI</small></span><span>f/8-11<small>LJÓSOP</small></span><span>200<small>ISO</small></span></div><p>Godox V1 · M · 1/8 eða 1/4</p></div><h3>Hvernig kom myndin út?</h3><div class="modegrid"><button class="pill" data-cool-help="subject">Fólkið er of dökkt</button><button class="pill" data-cool-help="trails">Engar ljósaslóðir</button><button class="pill" data-cool-help="bright">Of ljós</button><button class="pill" data-cool-help="ghost">Fólkið er óskýrt</button><button class="pill" data-cool-help="great">KÚL! ⚡</button></div><p id="coolhelp" class="note" aria-live="polite">Veldu niðurstöðu til að fá næsta skref.</p>`:''}<div class="navrow"><button class="navbtn" data-cool-prev ${coolStep===0?'disabled':''}>← Til baka</button><button class="navbtn primary" ${coolStep===6?'data-close':'data-cool-next'}>${coolStep===6?'Tilbúið ✓':'Næsta skref →'}</button></div><button class="back" style="margin-top:18px" data-close>Til baka í stillingar</button>`;document.querySelector('#guide').scrollIntoView({block:'start',behavior:'instant'})}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-cool')){coolStep=0;cool()}if(b.hasAttribute('data-cool-prev')){coolStep--;cool()}if(b.hasAttribute('data-cool-next')){coolStep++;cool()}if(b.dataset.coolHelp){document.querySelector('#coolhelp').textContent={subject:'Prófaðu að auka flassið úr 1/8 í 1/4 eða færa þig nær. Haltu öðrum gildum óbreyttum í prufumyndinni.',trails:'Finndu bjartari ljós í bakgrunni og prófaðu aðeins meiri hreyfingu. Á linsu sem leyfir það gefur f/8 meiri birtu frá umhverfinu en f/11 við sömu önnur gildi.',bright:'Ef fólkið er of bjart skaltu minnka flassstyrkinn. Ef bakgrunnurinn er of bjartur skaltu prófa f/11 í stað f/8 á linsu sem leyfir það og taka aðra prufumynd.',ghost:'Athugaðu fókus fyrst. Biddu fólkið að vera kyrrt. Prófaðu dimmari stað fyrir fólkið, þannig að flassið lýsi því meira en umhverfisljósið. Dragðu úr hreyfingu vélarinnar ef þarf.',great:'Yes! Taktu nokkrar fleiri með mismunandi lítilli hreyfingu og sjáðu hvað þér finnst flottast.'}[b.dataset.coolHelp]}});
function basics(pink){return `<section class="basics"><span class="eyebrow">Þegar þú vilt skilja meira</span><h2>Litla hjálparhellan</h2><details><summary>Hraði, ljósop og ISO, hvað þýðir þetta?</summary><p><b>Hraði (shutter):</b> Hversu lengi vélin safnar ljósi. 1/1000 er stuttur tími; 1/15 er lengri. Styttri tími hjálpar að frysta hreyfingu.</p><p><b>Ljósop (aperture):</b> Stærð opsins í linsunni. Lág f-tala hleypir meira ljósi inn og getur gert bakgrunninn óskýran.</p><p><b>ISO:</b> Hærri tala gerir myndina bjartari við sama hraða og ljósop, en getur aukið suð.</p><p>Prófaðu ljósopið hér. Þetta er skýring, ekki raunveruleg mynd úr vélinni:</p><div class="sim"><button data-f="1.8">f/1.8</button><button data-f="3.5" class="active">f/3.5</button><button data-f="8">f/8</button></div><div class="simscene" aria-label="Einföld sýning á óskýrum bakgrunni"><span class="subject">🧍</span><span class="tree" style="filter:blur(4px)">🌳</span></div><p class="result" aria-live="polite" id="simresult">f/3.5: Bakgrunnurinn getur verið mjúkur. Fjarlægð og linsa skipta líka máli.</p></details><details><summary>Hvernig kveiki ég og tek fyrstu myndina?</summary><ol><li>Settu ólina um hálsinn og taktu linsulokið af.</li><li>${pink?'Færðu rofann við stillingaskífuna á ON.':'Færðu aflrofann á ON og mynd-/myndbandsrofann á ljósmyndatáknið.'}</li><li>Veldu A+ og AF á linsunni ef AF/MF rofi er til staðar.</li><li>Ýttu hálfa leið niður til að fókusa og alla leið til að taka mynd.</li><li>Ýttu á ▶ á bakhliðinni til að skoða myndir.</li></ol></details><details><summary>Q · Flýtileið að stillingunum</summary><p>Ýttu á Q. Veldu stillingu á snertiskjánum eða með stefnuhnöppunum, breyttu gildinu og staðfestu ef þess þarf. Framboð stillinga fer eftir tökuhamnum.</p><div class="lcd"><div class="values"><span>1/250<small>HRAÐI</small></span><span>f/4<small>LJÓSOP</small></span><span>AUTO<small>ISO</small></span></div></div><p>Skjárinn hér sýnir dæmi. Raunverulegt útlit getur verið annað.</p></details><details><summary>Fókus · AF, MF og hreyfing</summary><p><b>AF:</b> Vélin fókusar. <b>MF:</b> Þú snýrð fókushring linsunnar sjálf/ur. Fyrir byrjendur: veldu AF.</p><p><b>One-Shot:</b> Fyrir kyrrstætt myndefni. <b>${pink?'AI Servo':'Servo'}:</b> Fyrir myndefni sem hreyfist. Veldu fókusstillingu á Q-skjánum þegar tökuhamurinn leyfir.</p><p>${pink?'Á skjánum (Live View) geturðu notað andlits-/augnfókus. Í optíska leitara virkar fókusinn öðruvísi.':'Andlits- og augnfókus getur hjálpað þegar þú myndar fólk. Athugaðu að ramminn sé á réttri manneskju.'}</p></details><details><summary>Ein mynd, margar myndir og tímastillir</summary><p>Í Q velurðu Drive mode þegar hamurinn leyfir. <b>Single shooting</b> tekur eina mynd. <b>Continuous</b> tekur fleiri meðan hnappinum er haldið niðri. <b>Self-timer</b> gefur þér tíma til að komast sjálf/ur inn í myndina.</p></details><details><summary>Litir, hvítjöfnun og skráarsnið</summary><p><b>WB / White balance:</b> Byrjaðu á AWB (Auto). Það hjálpar að laga liti að ljósinu.</p><p><b>Picture Style:</b> Breytir útliti JPEG-mynda. Standard er einfaldur upphafspunktur.</p><p><b>JPEG:</b> Tilbúin mynd sem er auðvelt að deila. <b>RAW:</b> Gefur meira svigrúm í eftirvinnslu. Spurðu Alex áður en þú breytir skráarsniðinu hans.</p></details><details><summary>Flass · hvað á ég að gera?</summary><p>${pink?'Lyftu flassinu varlega upp. Í M geturðu notað uppskrift Alex hér að ofan. Ef flassið skýtur ekki skaltu athuga rafhlöðu, bíða eftir hleðslu og athuga að Flash firing sé á Enable í valmyndinni.':'R8 hefur ekkert innbyggt flass. Ytra flass fer í flassskóinn ofan á vélinni. Spurðu Alex um flassið og tenginguna áður en þú byrjar.'}</p></details><details><summary>Hvernig tek ég myndband?</summary><p>${pink?'Færðu aflrofann á myndbandstáknið. Ýttu á Live View / myndbandshnappinn til að byrja og aftur til að stoppa.':'Færðu ljósmynd-/myndbandsrofann á myndbandstáknið. Ýttu á rauða myndbandshnappinn til að byrja og aftur til að stoppa.'}</p><p>Rauða upptökumerkið á skjánum sýnir að upptaka sé í gangi. Færðu rofann aftur í ljósmyndastöðu þegar þú ert búin/n.</p></details><details><summary>Hjálp, myndin er óskýr, dökk eða vélin tekur ekki mynd</summary><p><b>Óskýr:</b> Taktu lokið af, veldu AF, ýttu hálfa leið niður og prófaðu meiri birtu. Í Tv geturðu prófað hraðari lokara.</p><p><b>Dökk:</b> Prófaðu A+ eða ISO Auto. Í M þarf að samræma hraða, ljósop og ISO við birtuna.</p><p><b>Tekur ekki mynd:</b> Athugaðu rafhlöðu og minniskort. Reyndu að fókusa á eitthvað með skýrum brúnum og færðu þig lengra frá.</p><p><b>Ekki forsníða kortið eða eyða myndum Alex.</b> Spurðu hann ef kortið er fullt eða villuboð birtast.</p></details></section>`}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home')){history.pushState(null,'','#');home()}if(b.dataset.camera){camera=b.dataset.camera;mode='A+';history.pushState(null,'','#'+camera);page();window.scrollTo(0,0)}if(b.dataset.mode){mode=b.dataset.mode;page();document.querySelector('#guide').scrollIntoView({block:'nearest'})}if(b.hasAttribute('data-recipe')){step=0;recipe()}if(b.hasAttribute('data-prev')){step--;recipe()}if(b.hasAttribute('data-next')){step++;recipe()}if(b.hasAttribute('data-done')||b.hasAttribute('data-close')){mode='M';page();document.querySelector('#guide').scrollIntoView({block:'nearest'})}if(b.dataset.f){let v=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('.tree').style.filter=`blur(${v==='1.8'?8:v==='3.5'?4:0}px)`;document.querySelector('#simresult').textContent=v==='8'?'f/8: Meira af bakgrunninum getur verið skarpt. Þú þarft meira ljós eða lengri lýsingartíma.':`f/${v}: Bakgrunnurinn getur verið ${v==='1.8'?'mjög óskýr':'mjúkur'}. Fjarlægð og linsa skipta líka máli.`}});function route(){let c=location.hash.slice(1);if(c==='pink'||c==='r8'){camera=c;mode='A+';page()}else home()}addEventListener('popstate',route);route();
</script></html>
